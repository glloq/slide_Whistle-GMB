; PlatformIO project for the ESP32 universal slide-whistle controller.
;
; The Arduino sketch under esp32/esp32_slide_whistle/ stays openable in the
; Arduino IDE — this file adds a reproducible, dependency-locked build without
; removing that possibility (Section 16).
;
; Native unit tests run with plain g++ via tests/Makefile (see CI); the
; [env:native] target below mirrors that for `pio test`/`pio run` users.

[platformio]
src_dir  = esp32/esp32_slide_whistle
data_dir = esp32/esp32_slide_whistle/data
test_dir = tests
default_envs = esp32dev

[common]
build_flags = -std=gnu++17 -Wall
; Only the deps the UNIVERSAL firmware actually links (its web + JSON stack).
; The legacy sketch's extra libraries — and especially BLE-MIDI, whose bad ref
; broke the clone (review item #1) — live under [env:esp32dev] only, so the
; universal / S3 builds never fail cloning a dependency they don't use.
lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
    esphome/ESPAsyncWebServer-esphome @ 3.2.2
    esphome/AsyncTCP-esphome @ 2.1.3

; Legacy v3 multi-flute firmware (unchanged behaviour). Builds only the
; historic sketch; the universal entry point is filtered out.
[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
; The ESP32 Arduino platform forces -std=gnu++11 in its own build_flags; the
; portable core uses C++17 features (default member initializers in aggregate
; braced-init, if-constexpr, etc.). Un-flag the platform default so the C++17
; flag from ${common.build_flags} actually wins (review #1 §1.1).
build_unflags = -std=gnu++11
build_flags = ${common.build_flags} -DBOARD_ESP32_WROOM
build_src_filter = +<*> -<universal_main.cpp>
; Legacy sketch links the motion/servo/MIDI libraries. BLE-MIDI must be the
; library that actually provides <BLEMidi.h> + the BLEMidiServer object used by
; MIDIHandler.h — that is max22/ESP32-BLE-MIDI, NOT lathoub (whose header has a
; different name/API). Wrong lib = legacy build failure (review #1 §1.2).
lib_deps =
    ${common.lib_deps}
    waspinator/AccelStepper @ 1.64
    madhephaestus/ESP32Servo @ 3.0.6
    adafruit/Adafruit PWM Servo Driver Library @ 3.0.2
    fortyseveneffects/MIDI Library @ 5.0.2
    https://github.com/max22-/ESP32-BLE-MIDI.git
board_build.partitions = esp32/partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200

; New universal firmware (core + platform layer). Builds ONLY universal_main.cpp
; so it never collides with the legacy sketch's setup()/loop().
; EXPERIMENTAL — not yet hardware-validated; its CI build is informational.
[env:esp32-universal]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
build_unflags = -std=gnu++11
build_flags = ${common.build_flags} -DBOARD_ESP32_WROOM -DUNIVERSAL_FIRMWARE
build_src_filter = -<*> +<universal_main.cpp>
lib_deps = ${common.lib_deps}
board_build.partitions = esp32/partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
; Serve the NEW universal UI from LittleFS for this env instead of the legacy
; data/ folder (review item #3).
extra_scripts = pre:tools/universal_datadir.py

; Optional: ESP32-S3 (native USB MIDI possible here, unlike WROOM).
[env:esp32-s3]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
build_unflags = -std=gnu++11
build_flags = ${common.build_flags} -DBOARD_ESP32_S3 -DARDUINO_USB_MODE=1 -DUNIVERSAL_FIRMWARE
build_src_filter = -<*> +<universal_main.cpp>
lib_deps = ${common.lib_deps}
board_build.partitions = esp32/partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/universal_datadir.py

; Native env: builds & runs the portable core unit tests off-device.
; (CI drives these through tests/Makefile for full determinism.)
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra -I tests
test_build_src = no
