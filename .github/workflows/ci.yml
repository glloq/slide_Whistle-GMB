name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  native-tests:
    name: Native core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run portable core tests
        run: make -C tests
      # The suite fails CI if the default config has a GPIO collision, if any
      # preset is missing/invalid, or if a safety invariant regresses
      # (Sections 18 & 19).
      - name: Syntax-check the Arduino platform branch (both LEDC API versions)
        run: |
          mkdir -p /tmp/ardstub
          cat > /tmp/ardstub/Arduino.h <<'EOF'
          #pragma once
          #include <cstdint>
          #include <cmath>
          #define OUTPUT 1
          #define INPUT 0
          #define INPUT_PULLUP 2
          #define HIGH 1
          #define LOW 0
          inline void pinMode(int,int){}
          inline void digitalWrite(int,int){}
          inline int  digitalRead(int){return 0;}
          inline void delayMicroseconds(unsigned){}
          inline int  analogRead(int){return 0;}
          inline bool ledcAttach(uint8_t,uint32_t,uint8_t){return true;}
          inline void ledcSetup(uint8_t,uint32_t,uint8_t){}
          inline void ledcAttachPin(uint8_t,uint8_t){}
          inline void ledcWrite(uint8_t,uint32_t){}
          inline void ledcDetach(uint8_t){}
          inline void ledcDetachPin(uint8_t){}
          EOF
          H=esp32/esp32_slide_whistle/core/platform/EspSinks.h
          echo "== Arduino-ESP32 3.x =="
          g++ -std=c++17 -Wall -Wextra -DARDUINO=300 -DESP_ARDUINO_VERSION_MAJOR=3 -I/tmp/ardstub -fsyntax-only "$H"
          echo "== Arduino-ESP32 2.x =="
          g++ -std=c++17 -Wall -Wextra -DARDUINO=200 -I/tmp/ardstub -fsyntax-only "$H"

  json-validation:
    name: JSON assets valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: Validate JSON / manifest assets
        run: |
          python - <<'PY'
          import json, sys, glob
          files = glob.glob("esp32/esp32_slide_whistle/data/*.webmanifest")
          files += glob.glob("**/*.json", recursive=True)
          bad = 0
          for f in files:
              try:
                  json.load(open(f, encoding="utf-8"))
                  print("ok  ", f)
              except Exception as e:
                  print("FAIL", f, e); bad += 1
          sys.exit(1 if bad else 0)
          PY

  js-syntax:
    name: Web UI JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: node --check on UI scripts
        run: |
          for f in esp32/esp32_slide_whistle/data/app.js esp32/esp32_slide_whistle/data/sw.js; do
            echo "checking $f"; node --check "$f"; done

  clang-format:
    name: clang-format (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run formatting on core + tests
        run: |
          clang-format --version
          find esp32/esp32_slide_whistle/core tests -name '*.h' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror || true

  firmware-build:
    name: PlatformIO firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build ESP32-WROOM firmware (legacy v3 — gate)
        run: pio run -e esp32dev
      - name: Report firmware size
        run: pio run -e esp32dev -t size || true
      - name: Build universal firmware (EXPERIMENTAL — informational)
        continue-on-error: true
        run: pio run -e esp32-universal
