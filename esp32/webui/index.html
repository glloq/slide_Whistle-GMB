<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1420" />
  <title>Slide Whistle — Universal Controller</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">🎼 Slide Whistle</span>
    <span id="conn" class="pill pill-off" data-state="off">offline</span>
    <span id="restart" class="pill pill-warn" hidden>restart required</span>
    <button id="panic" class="btn btn-danger" type="button">PANIC</button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections"></nav>

  <main id="view" class="view" aria-live="polite"></main>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <noscript>This controller UI requires JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
